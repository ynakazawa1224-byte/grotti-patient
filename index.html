<!doctype html>
<html lang="ja"
  data-project-url="https://pseoapqcylxplevuifog.supabase.co"
  data-anon-key="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzZW9hcHFjeWx4cGxldnVpZm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NDQ1OTEsImV4cCI6MjA3MzIyMDU5MX0.L0ZmhpzvqNqnrqYHXFuAFc8mgk1I1F-LC1JGhI4pSTE">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>患者用入力フォーム（NRS 24h / 48h）</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />

  <style>
    :root{--bg:#0b1220;--panel:#111827;--muted:#94a3b8;--text:#e5e7eb;--brand:#2563eb;--ok:#16a34a;--warn:#f59e0b;--ring:rgba(59,130,246,.35)}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial;line-height:1.5}
    .wrap{max-width:720px;margin:48px auto;padding:0 16px} h1{font-size:24px;margin:0 0 20px}
    .card{background:var(--panel);border-radius:16px;padding:18px 18px 8px;border:1px solid rgba(148,163,184,.15);box-shadow:0 6px 20px rgba(0,0,0,.25)}
    .row{margin:12px 0} label{display:block;color:var(--muted);font-size:14px;margin:0 0 6px}
    input,textarea{width:100%;background:#0f172a;border:1px solid rgba(148,163,184,.18);color:var(--text);border-radius:12px;padding:12px 14px;outline:none}
    input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--ring)}
    textarea{min-height:140px;resize:vertical}
    .btn{display:inline-flex;align-items:center;gap:8px;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:12px 18px;font-weight:600;cursor:pointer}
    .btn:disabled{opacity:.5;cursor:not-allowed} .muted{color:var(--muted)}
    .pill{display:inline-block;background:rgba(148,163,184,.12);color:var(--text);border:1px solid rgba(148,163,184,.2);border-radius:999px;padding:4px 10px;font-size:12px}
    .toast{position:fixed;right:16px;bottom:16px;background:#111827;color:#e5e7eb;border:1px solid rgba(148,163,184,.2);padding:10px 14px;border-radius:12px;opacity:0;transform:translateY(8px);transition:all .25s}
    .toast.show{opacity:1;transform:translateY(0)}
    .tabs{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(11,18,32,0),var(--bg) 22%)}
    .tabs-inner{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;background:rgba(17,24,39,.9);backdrop-filter:saturate(140%) blur(8px);border:1px solid rgba(148,163,184,.15);border-radius:18px;margin:10px;padding:6px}
    .tab{padding:12px 8px;text-align:center;border-radius:12px;color:var(--muted);font-weight:600}
    .tab.active{background:rgba(37,99,235,.12);color:#cfe1ff;border:1px solid rgba(37,99,235,.35)}
    .idbar{position:sticky;top:0;z-index:5;background:#0b1220d9;backdrop-filter:blur(6px);border-bottom:1px solid rgba(148,163,184,.18);padding:10px 12px;display:none}
    .idbar-inner{max-width:720px;margin:0 auto;display:flex;gap:8px;align-items:center}
    .idbar input{flex:1}.link{color:#93c5fd;text-decoration:underline;cursor:pointer}
  </style>
  <!-- supabase-js v2 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <!-- ID未設定ガイド -->
  <div id="idbar" class="idbar">
    <div class="idbar-inner">
      <span class="pill" style="background:rgba(245,158,11,.15);border-color:rgba(245,158,11,.35);color:#fde68a">ID未設定</span>
      <input id="idInput" placeholder="患者IDを入力（例: P0123）" />
      <button id="idSaveBtn" class="btn" style="background:#16a34a">保存</button>
      <span class="link" id="idHelp">QRで開く方法</span>
    </div>
  </div>

  <div class="wrap">
    <h1>患者用入力フォーム（NRS 24h / 48h）</h1>

    <div class="card">
      <div class="row"><label>患者ID： <span id="pidView" class="pill">（未設定）</span></label></div>
      <div class="row"><label>24時間後の痛み（0〜10）</label><input id="nrs24" type="number" min="0" max="10" inputmode="numeric" placeholder="例: 5" /></div>
      <div class="row"><label>48時間後の痛み（0〜10）</label><input id="nrs48" type="number" min="0" max="10" inputmode="numeric" placeholder="例: 4" /></div>
      <div class="row"><label>コメント（任意）</label><textarea id="memo" placeholder="気になることがあればご記入ください。"></textarea></div>
      <div class="row"><button id="saveBtn" class="btn">保存する</button><span class="muted" style="margin-left:10px">保存後は院側アプリに反映されます。</span></div>
    </div>

    <div style="height:80px"></div>
  </div>

  <div class="tabs">
    <div class="tabs-inner">
      <div class="tab active">入力</div><div class="tab">予約</div><div class="tab">相談</div><div class="tab">プロフィール</div>
    </div>
  </div>

  <div id="toast" class="toast">保存しました。</div>

  <script src="app.js"></script>
</body>
</html>
