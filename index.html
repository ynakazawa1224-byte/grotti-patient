<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>患者用入力フォーム（NRS 24h / 48h）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon-192.png" />
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-soft: rgba(15, 23, 42, 0.6);
        --border: rgba(255, 255, 255, 0.08);
        --text: #e2e8f0;
        --muted: rgba(226, 232, 240, 0.6);
        --accent: #3b82f6;
        --danger: #f43f5e;
        --radius-lg: 18px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at top, #111827, #0f172a 50%, #020617 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .app-shell {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      header {
        padding: 20px 16px 4px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px;
        font-weight: 600;
      }
      main {
        flex: 1 1 auto;
        overflow-y: auto;
        padding: 0 16px 90px;
      }
      .card {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.05);
        border-radius: 20px;
        padding: 16px 16px 14px;
        margin-bottom: 14px;
        backdrop-filter: blur(12px);
      }
      label {
        display: block;
        font-size: 13px;
        margin-bottom: 6px;
      }
      .small-hint {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
      }
      input[type="number"],
      input[type="text"],
      input[type="url"],
      textarea {
        width: 100%;
        background: rgba(15, 23, 42, 0.35);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        padding: 10px 12px;
        color: #fff;
        font-size: 14px;
        outline: none;
      }
      input::placeholder,
      textarea::placeholder {
        color: rgba(226, 232, 240, 0.35);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .btn-primary {
        width: 100%;
        background: linear-gradient(120deg, #3b82f6, #2563eb);
        border: none;
        border-radius: 16px;
        padding: 12px 0;
        font-weight: 600;
        color: #fff;
        font-size: 15px;
        cursor: pointer;
      }
      .btn-secondary {
        width: 100%;
        background: rgba(15, 23, 42, 0.3);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 14px;
        padding: 10px 0;
        font-weight: 500;
        color: #e2e8f0;
        font-size: 14px;
        cursor: pointer;
      }
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(2, 6, 23, 0.85);
        backdrop-filter: blur(18px);
        border-top: 1px solid rgba(148, 163, 184, 0.12);
        display: flex;
        justify-content: space-around;
        padding: 8px 0 14px;
      }
      .tab-btn {
        background: none;
        border: none;
        color: rgba(226, 232, 240, 0.5);
        font-size: 14px;
        font-weight: 500;
      }
      .tab-btn.active {
        color: #fff;
      }
      .badge-inline {
        display: inline-block;
        background: rgba(59, 130, 246, 0.16);
        border: 1px solid rgba(59, 130, 246, 0.38);
        color: #eff6ff;
        padding: 2px 10px 2px;
        border-radius: 999px;
        font-size: 12px;
        margin-bottom: 8px;
      }
      .toast {
        position: fixed;
        right: 16px;
        bottom: 90px;
        background: rgba(15, 118, 110, 0.7);
        color: #ecfdf3;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 13px;
        backdrop-filter: blur(10px);
        opacity: 0;
        transform: translateY(12px);
        transition: all 0.25s ease-out;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      @media (min-width: 820px) {
        main {
          max-width: 520px;
          margin: 0 auto 90px;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header>
        <h1>患者用入力フォーム（NRS 24h / 48h）</h1>
      </header>
      <main id="app"></main>
    </div>

    <div class="bottom-nav">
      <button class="tab-btn active" data-tab="input">入力</button>
      <button class="tab-btn" data-tab="reserve">予約</button>
      <button class="tab-btn" data-tab="chat">相談</button>
      <button class="tab-btn" data-tab="profile">プロフィール</button>
    </div>

    <div id="toast" class="toast">保存しました</div>

    <script src="app.js"></script>
  </body>
</html>
