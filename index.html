<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>患者用入力フォーム（NRS 24h / 48h）</title>

  <!-- ★ Supabase 設定（必須）：ここを書き換えてください -->
  <meta name="supabase-url" content="https://pseoapqcylxplevuifog.supabase.co">
  <meta name="supabase-anon-key" content="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBzZW9hcHFjeWx4cGxldnVpZm9nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc2NDQ1OTEsImV4cCI6MjA3MzIyMDU5MX0.L0ZmhpzvqNqnrqYHXFuAFc8mgk1I1F-LC1JGhI4pSTE">

  <!-- デザイン最小 -->
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif; background:#0e1420; color:#e5e7eb; }
    .wrap { max-width: 720px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0 0 16px; }
    .card { background:#111827; border:1px solid #1f2937; border-radius:12px; padding:16px; }
    .row { margin: 12px 0; }
    label { display:block; margin-bottom:6px; color:#93a3b8; font-size:13px; }
    input, textarea, select { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #334155; background:#0b1322; color:#e5e7eb; }
    textarea { height: 100px; resize: vertical; }
    .btn { display:inline-block; padding:10px 16px; border-radius:10px; border:1px solid #2563eb; background:#2563eb; color:#fff; cursor:pointer; font-weight:600; }
    .btn:disabled { opacity:.6; cursor:not-allowed; }
    .muted { color:#94a3b8; font-size:12px; }
    .ok { color:#34d399; }
    .err { color:#f87171; }
    .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
    .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:12px; border:1px solid #334155; }
    .pill.red { color:#f87171; border-color:#f87171; }
    .pill.green { color:#34d399; border-color:#34d399; }
  </style>

  <!-- supabase-js（v2 CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="toolbar">
      <span class="pill" id="libState">ライブラリ：確認中</span>
      <span class="pill" id="urlState">Project URL：確認中</span>
      <span class="pill" id="keyState">Anon Key：確認中</span>
      <span class="muted" id="patientIdView"></span>
    </div>

    <h1>患者用入力フォーム（NRS 24h / 48h）</h1>

    <div class="card">
      <div class="row">
        <label>24時間後の痛み（0〜10）</label>
        <input id="nrs24" type="number" inputmode="numeric" min="0" max="10" placeholder="例: 3" />
      </div>
      <div class="row">
        <label>48時間後の痛み（0〜10）</label>
        <input id="nrs48" type="number" inputmode="numeric" min="0" max="10" placeholder="例: 2" />
      </div>
      <div class="row">
        <label>コメント（任意）</label>
        <textarea id="memo" placeholder="メモがあればご入力ください"></textarea>
      </div>
      <div class="row">
        <button class="btn" id="saveBtn">保存する</button>
        <span id="saveMsg" class="muted" style="margin-left:12px;"></span>
      </div>
      <div class="row">
        <span class="muted">このフォームで入力いただいた内容は、院の管理アプリに反映されます。</span>
      </div>
    </div>
  </div>

  <!-- アプリ本体 -->
  <script src="./app.js"></script>
</body>
</html>
