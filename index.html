<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>患者入力フォーム</title>

  <!-- （任意）PWAを使っているなら残してください -->
  <link rel="manifest" href="manifest.json" />

  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background:#0f172a; color:#fff; margin:0; }
    .container { max-width: 720px; margin: 0 auto; padding: 20px; }
    .card { background: #111827; border: 1px solid #374151; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .row { display: grid; gap: 10px; }
    label { font-size: 13px; opacity: .9; }
    input, textarea, select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #374151; background: #0b1220; color: #fff; }
    button { background: #06b6d4; border: 0; padding: 10px 12px; border-radius: 8px; color: #fff; cursor: pointer; }
    button.secondary { background: #4b5563; }
    .muted { font-size: 12px; color: #9ca3af; }
    .tabs { display:flex; gap:12px; margin-bottom: 12px; }
    .tab { padding:8px 12px; border-radius:9999px; border:1px solid #374151; background:#0b1220; cursor:pointer; }
    .tab.active { background:#1f2937; }
    .ok { color:#34d399; }
    .ng { color:#fca5a5; }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="margin:0 0 12px;">患者入力フォーム</h1>
    <div class="muted" id="statusLine">設定確認中…</div>

    <div class="tabs">
      <div class="tab active" id="tabInput">入力</div>
      <div class="tab" id="tabReserve">予約</div>
      <div class="tab" id="tabProfile">プロフィール</div>
    </div>

    <!-- 入力タブ -->
    <div class="card" id="viewInput">
      <div class="row">
        <label>患者ID（読み取り専用）</label>
        <input id="pid" readonly />
      </div>
      <div class="row" style="margin-top:10px;">
        <label>24h後 NRS（0〜10）</label>
        <input id="nrs24" type="number" min="0" max="10" />
      </div>
      <div class="row">
        <label>48h後 NRS（0〜10）</label>
        <input id="nrs48" type="number" min="0" max="10" />
      </div>
      <div class="row">
        <label>コメント（任意）</label>
        <textarea id="memo" rows="3"></textarea>
      </div>
      <div style="margin-top:12px;">
        <button id="btnSave">保存する</button>
        <span class="muted" id="saveMsg" style="margin-left:8px;"></span>
      </div>
    </div>

    <!-- 予約タブ -->
    <div class="card" id="viewReserve" style="display:none;">
      <div class="row">
        <label>予約ページ</label>
        <button id="openReserve">予約ページを開く</button>
      </div>
      <div class="muted" style="margin-top:8px;">※ 予約URLは院側アプリから自動連携されます。</div>
    </div>

    <!-- プロフィールタブ -->
    <div class="card" id="viewProfile" style="display:none;">
      <div class="row">
        <label>患者ID</label>
        <input id="profPid" />
      </div>
      <div class="row">
        <label>Supabase URL</label>
        <input id="profSUrl" />
      </div>
      <div class="row">
        <label>Supabase ANON KEY</label>
        <input id="profAKey" />
      </div>
      <div class="row">
        <label>予約URL</label>
        <input id="profRUrl" />
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <button id="btnProfSave">この端末に保存</button>
        <button id="btnReload" class="secondary">設定を再読み込み</button>
      </div>
      <div class="muted" style="margin-top:8px;">※ 値が空の場合は院側のQRから読み込んでください。</div>
    </div>
  </div>

  <!-- ★★★ Safari対応：ここで“先に”クエリをlocalStorageへ保存（deferやhead内では実行しない） -->
  <script>
    (function bootstrapFromQuery() {
      try {
        var q = new URLSearchParams(location.search);
        var id   = q.get("id");
        var sUrl = q.get("supabaseUrl");
        var aKey = q.get("anonKey");
        var rUrl = q.get("reserveUrl");

        if (id)   localStorage.setItem("patientId", id);
        if (sUrl) localStorage.setItem("supabaseUrl", sUrl);
        if (aKey) localStorage.setItem("supabaseAnonKey", aKey);
        if (rUrl) localStorage.setItem("reserveUrl", rUrl);

        // URL掃除（履歴は汚さない）
        if (id || sUrl || aKey || rUrl) {
          history.replaceState(null, "", location.origin + location.pathname);
        }
      } catch (e) {
        console.warn("bootstrapFromQuery error:", e);
      }
    })();
  </script>

  <!-- 本体ロジック（必ず上のbootstrapを実行した後に読み込む） -->
  <script src="./app.js"></script>
</body>
</html>
